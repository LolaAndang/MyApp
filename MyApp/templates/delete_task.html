{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Delete Task</h2>
    <p>Are you sure you want to delete the task: <strong>"{{ task.title }}"</strong>?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
        <a href="{% url 'task_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
